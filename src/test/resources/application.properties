# Settings for tests. The real src/main/resources/application.properties is gitignored, so on
# CI this is the only config the tests get. Every value below is a placeholder.

# In-memory database (same settings as StudySpaceIntegrationTest)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=YEAR
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# JWT: the secret must be at least 256 bits for HMAC-SHA
jwt.secret=test-only-jwt-secret-0123456789abcdef0123456789abcdef
jwt.expiration=86400000

# External services: placeholders, never called by the tests
gemini.api.key=test-gemini-key
weather.api.key=test-weather-key
aws.access-key-id=test-access-key
aws.secret-access-key=test-secret-key
aws.region=us-east-1
aws.s3.bucket-name=test-bucket
stripe.secret-key=sk_test_placeholder
stripe.webhook-secret=whsec_placeholder

# Mail
spring.mail.host=localhost
spring.mail.port=2525
app.mail.from=noreply@example.com
